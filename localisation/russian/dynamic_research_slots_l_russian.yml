l_russian:
  dynamic_research_slots_decisions:0 "Динамические ячейки исследований"
  dynamic_research_slots_decisions_desc:0 "§PНаши заводы генерируют очки исследований (RP).§! Когда RP достигает определенных значений мы получаем больше ячеек для исследований, но мы также можем потерять ячейки исследований если значение нашего RP опустится слишком низко.\n\n§YВсего RP: [?total_research_power]§!\n§YСледующая ячейка исследований через: [?next_research_slot_at]§!\n\n§RP от гражданских фабрик:§! [?civilian_research_power]\n§RP от военных заводов:§! [?military_research_power]\n§RP от верфей:§! [?naval_research_power]\n§RP от экспериментальных комплексов:§! [?facility_research_power]\n\n§Модификаторы RP: [?total_rp_modifier|%+]§!\n§Война / мир эффект: [?war_rp_penalty_effective|%+]§!\n§YФракционный бонус: [?alliance_bonus_pct|%+]§!\n\nИспользуйте \"ПОМОЩЬ\" в решениях для более детальной информации."
  
  dynamic_research_slots_help:0 "ПОМОЩЬ"
  dynamic_research_slots.help.title:0 "Динамические ячейки исследований (помощь)"
  dynamic_research_slots.help.desc:0 "§RP от гражданских фабрик:§! [?research_power_per_civ]\n§RP от военных заводов:§! [?research_power_per_mil]\n§RP от верфей:§! [?research_power_per_nav]\n§RP от экспериментальных комплексов:§! [?facility_research_power] (Физических исследований: +50 RP, Морской/Авиационный/Наземный: +35 RP за каждый)\n\n§PЛегкие ячейки исследований:§! [?easy_research_slots]\n§WЛегкие ячейки исследований - ячейки со старта игры (или полученные по фокусам и т.д) требования RP которых снижены до [?easy_research_slot_coefficient|%.0].§!\n\n§RP порогов ячеек исследований:§!\n§W1: [?research_for_slot^1] RP\n2: [?research_for_slot^2] RP\n3: [?research_for_slot^3] RP\n4: [?research_for_slot^4] RP\n5: [?research_for_slot^5] RP\n6: [?research_for_slot^6] RP\n7: [?research_for_slot^7] RP\n8: [?research_for_slot^8] RP\n9: [?research_for_slot^9] RP\n10: [?research_for_slot^10] RP§!\n\n§PБольше информации:§!\n§WНажмите \"Больше деталей\" ниже, чтобы увидеть, как война, законы и фракция влияют на ваши RP.§!"
  
  dynamic_research_slots.help.a:0 "Хорошо"
  dynamic_research_slots.help.b:0 "Больше деталей"
  
  dynamic_research_slots.1.title:0 "Ячейки для исследований изменены"
  dynamic_research_slots.1.desc:0 "Из за нашего текущего RP, количество доступных ячеек для исследований изменилось.\n\nБыло ячеек: [?current_research_slots|R]\nСтало ячеек: [?target_research_slots|G]"
  dynamic_research_slots.1.a:0 "Это справедливо...правда?"
  
  dynamic_research_slots.2.title:0 "Легкие ячейки для исследований изменены"
  dynamic_research_slots.2.desc:0 "Вместо предоставления прямых ячеек для исследований, национальные фокусы теперь увеличивают число \"легких ячеек для исследований\", это количество исследовательских ячеек, для которых требования к RP снижены до [?easy_research_slot_coefficient|%.0].\n\nНовое число легких ячеек: [?temp|B]\nОбщее число легких ячеек: [?easy_research_slots|B]"
  dynamic_research_slots.2.a:0 "Идеально сбалансировано, как и должно быть."
  
  dynamic_research_slots.4.title:0 "Дебаг динамичесских исследований"
  dynamic_research_slots.4.desc:0 "Текущая разбивка RP и внутренние переменные:\n\Всего RP: [?total_research_power]\nRP от гражданских фабрик: [?civilian_research_power]\nRP от военных заводов: [?military_research_power]\nRP от верфей: [?naval_research_power]\nRP от комплексов: [?facility_research_power]\n\nТекущие ячейки: [?current_research_slots]\nЦелевые ячейки: [?target_research_slots]\nЛегкие ячейки: [?easy_research_slots]\nКоэффициент лёгких ячеек: [?easy_research_slot_coefficient]\n\nКД событий игрока: [?dr_player_event_cooldown]\nТаймер обновления ИИ: [?dr_days_until_update]"
  dynamic_research_slots.4.a:0 "Закрыть"
  
  dynamic_research_slots.5.title:0 "Динамические исследовательские ячейки — расширенные сведения"
  dynamic_research_slots.5.desc:0 "§Эффект войны & мира:§!\n§WThe game rule War-time Research Power sets the maximum wartime RP penalty (for example -10%, -20%, -30%). The effective penalty depends on War Support, Stability, ruling party popularity, war length and whether the war is offensive or defensive. Defensive wars ramp up more slowly and apply a smaller penalty.§!\n[GetDRWarRuleNote]\n\n§PLaws & Research Power:§!\n§WTrade laws:§!\n- Free Trade: §G+2%§! RP\n- Export Focus: §G+1%§! RP\n- Closed Economy: §R-1%§! RP\n\n§WEconomy laws:§!\n- Civilian Economy: §G+2%§! RP\n- Early Mobilization: §G+1%§! RP\n- War Economy: §R-1%§! RP\n- Total Mobilization: §R-2%§! RP\n\n§WConscription laws:§!\n- Extensive Conscription: §R-2%§! RP\n- Service by Requirement: §R-4%§! RP\n- All Adults Serve: §R-7%§! RP\n- Scraping the Barrel: §R-10%§! RP\n[GetDRLawRuleNote]\n\n§PAlliances:§!\n§WEach ally can contribute up to §G+5%§! of its own Research Power, scaled by relations. The total alliance bonus is capped by the Alliance Research Power game rule.§!\n[GetDRAllianceRuleNote]"
  dynamic_research_slots.5.a:0 "Got it"
  
  EFFECT_ADD_RESEARCH_SLOT:0 "Add $COUNT|G$ to Easy Research Slots. (Easy Research Slots is the number of research slots with their RP requirement lowered to make it easier for nations to reach certain amount of research slots.)"
  EFFECT_REMOVE_RESEARCH_SLOT:0 "Remove $COUNT|R$ from Easy Research Slots. (Easy Research Slots is the number of research slots with their RP requirement lowered to make it easier for nations to reach certain amount of research slots.)"

  DR_EMPTY_LOC:0 ""
  
  DR_WAR_RULE_NOTE_OFF:0 "§YNote:§! The War-time Research Power rule is set to §Y\"No change\"§!. As a result, the war / peace effect line in the overview will always show §Y0%§! and has no impact on Research Power."
  DR_LAW_RULE_NOTE_OFF:0 "§YNote:§! The Law-based Research Power Modifiers rule is set to §Y\"Disabled\"§!. The law modifiers listed above are ignored; only factories and experimental facilities contribute to RP."
  DR_ALLIANCE_RULE_NOTE_OFF:0 "§YNote:§! The Alliance Research Power rule is set to §Y\"No bonus\"§!. The alliance bonus line in the overview will always show §Y0%§! and has no impact on Research Power."
