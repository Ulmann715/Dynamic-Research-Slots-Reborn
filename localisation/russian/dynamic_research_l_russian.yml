l_russian:
  # Startup notification localisation
  dynamic_research_startup_title:0 "Инициализация динамических ячеек исследований"
  dynamic_research_startup_desc:0 "Динамические очки исследований теперь активны. Ваши заводы будут создавать очки исследований (RP) каждый день. Когда RP достигнут определенных пороговых значений - ячейки для исследований будут открыты автоматически; Если ваши RP опускаются ниже пороговых значений - ячейка для исследований будет потеряна. Продолжайте наращивать промышленный потенциал, чтобы поддерживать или повышать эффективность исследований. Существующие ячейки исследований больше 2 рассматриваются как лёгкие исследовательские ячейки с пониженными пороговыми значениями RP, а не теряются безвозвратно."
  dynamic_research_startup_option:0 "Понятно!"

  # Custom game rules
  RULE_GROUP_DYNAMIC_RESEARCH:0 "Динамические исследования"

  # Easy Research Slots (Base)
  RULE_DR_EASY_SLOTS:0 "Легкие ячейки исследований (Base)"
  RULE_DR_EASY_SLOTS_DESC:0 "Управляет количеством дополнительных лёгких ячеек для исследований, доступных каждой стране в дополнение к стандартному поведению. Лёгкие ячейки дешевле в обслуживании и требуют меньше RP для разблокировки."
  
  RULE_DR_EASY_SLOTS_DEFAULT:0 "По умолчанию"
  RULE_DR_EASY_SLOTS_DEFAULT_DESC:0 "Используйте стандартную логику динамических исследовательских ячеек. Только исследовательские ячейки, предоставленные в начале игры или через фокусы, считаются лёгкими ячейками."
  
  RULE_DR_EASY_SLOTS_PLUS_1:0 "+1 Лёгкая ячейка"
  RULE_DR_EASY_SLOTS_PLUS_1_DESC:0 "Каждая страна начинает с одной дополнительной лёгкой ячейкой исследований."
  
  RULE_DR_EASY_SLOTS_PLUS_2:0 "+2 Лёгкие ячейки"
  RULE_DR_EASY_SLOTS_PLUS_2_DESC:0 "Каждая страна начинает с двумя дополнительной лёгкой ячейкой исследований."
  
  RULE_DR_EASY_SLOTS_PLUS_3:0 "+3 Лёгкие ячейки"
  RULE_DR_EASY_SLOTS_PLUS_3_DESC:0 "Каждая страна начинает с тремя дополнительными лёгкими ячейками исследований."
  
  RULE_DR_EASY_SLOTS_PLUS_4:0 "+4 Лёгкие ячейки"
  RULE_DR_EASY_SLOTS_PLUS_4_DESC:0 "Каждая страна начинает с четырьмя дополнительными лёгкими ячейками исследований."
  
  RULE_DR_EASY_SLOTS_PLUS_5:0 "+5 Лёгких ячеек"
  RULE_DR_EASY_SLOTS_PLUS_5_DESC:0 "Каждая страна начинает с пятью дополнительными лёгкими ячейками исследований."

  # Easy Slot RP Cost Factor
  RULE_DR_EASY_COST:0 "Фактор стоимости RP для лёгких ячеек"
  RULE_DR_EASY_COST_DESC:0 "Контролирует, сколько RP требуется для лёгких ячеек по сравнению с обычными. Чем ниже значение, тем проще (дешевле) ячейки."
  
  RULE_DR_EASY_COST_10:0 "10% от нормальной стоимости"
  RULE_DR_EASY_COST_10_DESC:0 "Лёгкие ячейки исследований требуют только 10% от стандартного RP."
  
  RULE_DR_EASY_COST_20:0 "20% от нормальной стоимости"
  RULE_DR_EASY_COST_20_DESC:0 "Лёгкие ячейки исследований требуют только 20% от стандартного RP."
  
  RULE_DR_EASY_COST_30:0 "30% от нормальной стоимости"
  RULE_DR_EASY_COST_30_DESC:0 "Лёгкие ячейки исследований требуют только 30% от стандартного RP."
  
  RULE_DR_EASY_COST_40:0 "40% от нормальной стоимости"
  RULE_DR_EASY_COST_40_DESC:0 "Лёгкие ячейки исследований требуют только 40% от стандартного RP."
  
  RULE_DR_EASY_COST_50:0 "50% от нормальной стоимости"
  RULE_DR_EASY_COST_50_DESC:0 "Лёгкие ячейки исследований требуют только 50% от стандартного RP."
  
  RULE_DR_EASY_COST_60:0 "60% от нормальной стоимости"
  RULE_DR_EASY_COST_60_DESC:0 "Лёгкие ячейки исследований требуют только 60% от стандартного RP. Это соответствует поведению оригинального мода."
  
  RULE_DR_EASY_COST_70:0 "70% от нормальной стоимости"
  RULE_DR_EASY_COST_70_DESC:0 "Лёгкие ячейки исследований требуют только 70% от стандартного RP."
  
  RULE_DR_EASY_COST_80:0 "80% от нормальной стоимости"
  RULE_DR_EASY_COST_80_DESC:0 "Лёгкие ячейки исследований требуют только 80% от стандартного RP."
  
  RULE_DR_EASY_COST_90:0 "90% от нормальной стоимости"
  RULE_DR_EASY_COST_90_DESC:0 "Лёгкие ячейки исследований требуют только 90% от стандартного RP."
  
  RULE_DR_EASY_COST_100:0 "100% от нормальной стоимости"
  RULE_DR_EASY_COST_100_DESC:0 "Лёгкие ячейки исследований требуют полную стоимость RP обычной ячейки (без скидки)."

  # Minor Nation Easy Slots
  RULE_DR_MINOR_EASY_SLOTS:0 "Лёгкие ячейки для минорных стран"
  RULE_DR_MINOR_EASY_SLOTS_DESC:0 "Контролирует, получат ли минорные страны дополнительный слот для исследований, чтобы помочь им идти в ногу со временем в технологическом плане."
  
  RULE_DR_MINOR_EASY_SLOTS_OFF:0 "Выключено"
  RULE_DR_MINOR_EASY_SLOTS_OFF_DESC:0 "Минорные страны используют те же настройки лёгких ячеек исследований, что и страны-мажоры."
  
  RULE_DR_MINOR_EASY_SLOTS_ON:0 "Включено (без ачивок)"
  RULE_DR_MINOR_EASY_SLOTS_ON_DESC:0 "Минорные страны получают одну дополнительную лёгкую ячейку исследования. Это немного упрощает игру за миноров и отключает достижения."

  # Factory RP Weights
  RULE_DR_FACTORY_WEIGHTS:0 "Значения RP от промышленности"
  RULE_DR_FACTORY_WEIGHTS_DESC:0 "Контролирует, сколько RP генерируют гражданские фабрики, военные заводы и верфи."
  
  RULE_DR_FACTORY_WEIGHTS_BALANCED:0 "Сбалансировано (3 / 2 / 2)"
  RULE_DR_FACTORY_WEIGHTS_BALANCED_DESC:0 "Гражданские фабрики генерируют 3 RP каждая, военные заводы и верфи генерируют 2 RP каждый."
  
  RULE_DR_FACTORY_WEIGHTS_INDUSTRY:0 "Индустриальный фокус (4 / 2 / 1)"
  RULE_DR_FACTORY_WEIGHTS_INDUSTRY_DESC:0 "Гражданские фабрики генерируют 4 RP каждая, военные заводы 2 RP и верфи 1 RP."
  
  RULE_DR_FACTORY_WEIGHTS_MILITARY:0 "Военный фокус (2 / 4 / 2)"
  RULE_DR_FACTORY_WEIGHTS_MILITARY_DESC:0 "Военные заводы генерируют 4 RP каждый, гражданские фабрики и верфи 2 RP каждый."
  
  RULE_DR_FACTORY_WEIGHTS_NAVAL:0 "Морской фокус (2 / 2 / 4)"
  RULE_DR_FACTORY_WEIGHTS_NAVAL_DESC:0 "Верфи генерируют 4 RP каждый, гражданские фабрики и военные заводы 2 RP каждый."

  # War-time Research Power
  RULE_DR_WAR_RP:0 "RP в военное время"
  RULE_DR_WAR_RP_DESC:0 "Устанавливает максимальный штраф к RP во время войны. Значения штрафа зависит от поддержки войны, стабильности, популярности правящей партии, продолжительности войны и того, является ли война наступательной или оборонительной."
  
  RULE_DR_WAR_RP_OFF:0 "Без изменений"
  RULE_DR_WAR_RP_OFF_DESC:0 "Война не оказывает влияния на RP"
  
  RULE_DR_WAR_RP_MINUS_5:0 "Максимально -5% RP во время войны"
  RULE_DR_WAR_RP_MINUS_5_DESC:0 "Устанавливает максимальный штраф от войны -5% RP. Фактически, штраф обычно меньше и зависит от внутренних условий (поддержка войны, стабильность, правящая партия, продолжительность войны, наступательные/оборонительные войны)."
  
  RULE_DR_WAR_RP_MINUS_10:0 "Максимально -10% RP во время войны (по умолчанию)"
  RULE_DR_WAR_RP_MINUS_10_DESC:0 "Устанавливает максимальный штраф от войны -10% RP. Фактически, штраф обычно меньше и зависит от внутренних условий (поддержка войны, стабильность, правящая партия, продолжительность войны, наступательные/оборонительные войны)."
  
  RULE_DR_WAR_RP_MINUS_15:0 "Максимально -15% RP во время войны"
  RULE_DR_WAR_RP_MINUS_15_DESC:0 "Устанавливает максимальный штраф от войны -15% RP. Фактически, штраф обычно меньше и зависит от внутренних условий (поддержка войны, стабильность, правящая партия, продолжительность войны, наступательные/оборонительные войны)."
  
  RULE_DR_WAR_RP_MINUS_20:0 "Максимально -20% RP во время войны"
  RULE_DR_WAR_RP_MINUS_20_DESC:0 "Устанавливает максимальный штраф от войны -20% RP. Фактически, штраф обычно меньше и зависит от внутренних условий (поддержка войны, стабильность, правящая партия, продолжительность войны, наступательные/оборонительные войны)."
  
  RULE_DR_WAR_RP_MINUS_25:0 "Максимально -25% RP во время войны"
  RULE_DR_WAR_RP_MINUS_25_DESC:0 "Устанавливает максимальный штраф от войны -25% RP. Фактически, штраф обычно меньше и зависит от внутренних условий (поддержка войны, стабильность, правящая партия, продолжительность войны, наступательные/оборонительные войны)."
  
  RULE_DR_WAR_RP_MINUS_30:0 "Максимально -30% RP во время войны"
  RULE_DR_WAR_RP_MINUS_30_DESC:0 "Устанавливает максимальный штраф от войны -30% RP. Фактически, штраф обычно меньше и зависит от внутренних условий (поддержка войны, стабильность, правящая партия, продолжительность войны, наступательные/оборонительные войны)."

  # Alliance Research Power
  RULE_DR_ALLIANCE_RP:0 "RP во фракциях (союзах)"
  RULE_DR_ALLIANCE_RP_DESC:0 "Устанавливает максимальный бонус к RP для членов фракции. Каждый член фракции может внести до 5% своего RP, масштабируемого по уровню отношений, но общий бонус фракции ограничен этим правилом."
  
  RULE_DR_ALLIANCE_RP_OFF:0 "Без бонуса"
  RULE_DR_ALLIANCE_RP_OFF_DESC:0 "Принадлежность к фракции не дает никаких бонусов к RP фракции."
  
  RULE_DR_ALLIANCE_RP_PLUS_5:0 "Максимально +5% RP от союзников"
  RULE_DR_ALLIANCE_RP_PLUS_5_DESC:0 "Бонусы фракции могут обеспечить до +5% RP от членов фракции (каждый союзник до 5% от своего RP, масштабируется в зависимости от отношений, но не более +5% в общей сложности)."
  
  RULE_DR_ALLIANCE_RP_PLUS_10:0 "Максимально +10% RP от союзников (по умолчанию)"
  RULE_DR_ALLIANCE_RP_PLUS_10_DESC:0 "Бонусы фракции могут обеспечить до +10% RP от членов фракции (каждый союзник до 5% от своего RP, масштабируется в зависимости от отношений, но не более +10% в общей сложности)."
  
  RULE_DR_ALLIANCE_RP_PLUS_15:0 "Максимально +15% RP от союзников"
  RULE_DR_ALLIANCE_RP_PLUS_15_DESC:0 "Бонусы фракции могут обеспечить до +15% RP от членов фракции (каждый союзник до 5% от своего RP, масштабируется в зависимости от отношений, но не более +15% в общей сложности)."
  
  RULE_DR_ALLIANCE_RP_PLUS_20:0 "Максимально +20% RP от союзников"
  RULE_DR_ALLIANCE_RP_PLUS_20_DESC:0 "Бонусы фракции могут обеспечить до +20% RP от членов фракции (каждый союзник до 5% от своего RP, масштабируется в зависимости от отношений, но не более +20% в общей сложности)."
  
  RULE_DR_ALLIANCE_RP_PLUS_25:0 "Максимально +25% RP от союзников"
  RULE_DR_ALLIANCE_RP_PLUS_25_DESC:0 "Бонусы фракции могут обеспечить до +25% RP от членов фракции (каждый союзник до 5% от своего RP, масштабируется в зависимости от отношений, но не более +25% в общей сложности)."
  
  RULE_DR_ALLIANCE_RP_PLUS_30:0 "Максимально +30% RP от союзников"
  RULE_DR_ALLIANCE_RP_PLUS_30_DESC:0 "Бонусы фракции могут обеспечить до +30% RP от членов фракции (каждый союзник до 5% от своего RP, масштабируется в зависимости от отношений, но не более +30% в общей сложности)."

  # Law-based Research Power Modifiers
  RULE_DR_LAW_RP:0 "Модификаторы RP, основанные на законах"
  RULE_DR_LAW_RP_DESC:0 "Управляет тем, влияют ли законы торговли, экономики и воинской повинности на RP. При отключении эти законы больше не влияют на исследовательскую мощь — применяются только правила заводов, предприятий, военного времени и фракций."
  
  RULE_DR_LAW_RP_ON:0 "Включено (по умолчанию)"
  RULE_DR_LAW_RP_ON_DESC:0 "Сохраните все существующие модификаторы RP из законов о торговле (например, «Свободная торговля»), законов об экономике (например, «Гражданская экономика», «Военная экономика») и законов о воинской повинности (например, «Всеобщая воинская повинность»."
  
  RULE_DR_LAW_RP_OFF:0 "Отключено"
  RULE_DR_LAW_RP_OFF_DESC:0 "Игнорировать все модификаторы RP, связанные с законами о торговле, экономике и воинской повинности. Это делает RP зависящей только от фабрик, предприятий и других правил динамических исследований."
